<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Statement of Values · RenewFlo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap">
<style>
  /* Read-only broker packet: one letter-width sheet per part, same look as the renewal summaries. */
  :root{ --ink:#141B2D; --body:#3F4859; --muted:#7C8698; --faint:#8E97A8; --line:#E1E7F0; --soft:#F1F4F9; --blue:#2D6BD4; --blue-soft:#E8F1FE; --bg:#EDF0F5; --bad:#C7362A; --bad-soft:#FBE7E5; --warn:#A86400; --warn-soft:#FDF1DC; }
  *{margin:0;padding:0;box-sizing:border-box}
  [hidden]{display:none !important}
  body{font-family:'Lato',Arial,sans-serif;color:var(--body);font-size:13.5px;line-height:1.5;background:var(--bg);padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  h1,h2,h3{font-family:Arial,'Liberation Sans',sans-serif;color:var(--ink);text-wrap:balance}
  h1{font-size:24px;font-weight:600;letter-spacing:-.4px}
  h2{font-size:17px;font-weight:600}
  .over{color:var(--blue);text-transform:uppercase;font-size:10.5px;font-weight:700;letter-spacing:1.6px}
  .sheet{background:#fff;width:8.5in;max-width:100%;margin:0 auto 22px;padding:40px 48px;border-radius:4px;box-shadow:0 2px 14px rgba(15,27,45,.08);display:flex;flex-direction:column;gap:16px}
  @media (max-width:820px){.sheet{padding:22px 16px}}
  .titlerow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .titlerow > div{display:flex;flex-direction:column;gap:5px;min-width:0}
  .sub{color:var(--muted);font-size:12.5px}
  .demo{background:var(--warn-soft);border:1px solid var(--warn);border-radius:8px;padding:9px 13px;font-size:12.5px;color:var(--ink)}
  .share{background:var(--blue-soft);border-radius:12px;padding:12px 16px;color:#22304A;font-size:13px}
  .btn{font:inherit;font-weight:700;font-size:12.5px;border:1px solid #D5DDEA;background:#fff;border-radius:100px;padding:7px 14px;cursor:pointer;color:var(--ink)}
  .btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .top{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .card{background:var(--blue-soft);border-radius:12px;padding:12px 16px}
  .card span{display:block;font-family:Arial,sans-serif;font-weight:700;font-size:12.5px;color:#22304A}
  .card b{display:block;font-family:Arial,sans-serif;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
  .tbl{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{background:var(--soft);color:var(--ink);text-transform:uppercase;font-size:10.5px;letter-spacing:.5px;padding:9px 10px;text-align:right;font-weight:700}
  th:first-child,td:first-child{text-align:left}
  td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle;font-variant-numeric:tabular-nums}
  td:first-child{font-weight:700;color:var(--ink)}
  tr.band td{background:#fff;text-align:left;padding:14px 10px 6px;border-bottom:1.5px solid var(--line)}
  tr.band b{color:var(--blue);text-transform:uppercase;font-size:11px;letter-spacing:1.3px;font-family:Arial,sans-serif}
  td.nc{color:var(--bad);font-weight:700;text-align:center;background:var(--bad-soft)}
  td.blank{color:var(--faint)}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px}
  .kv div{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
  .kv dt{color:var(--body)} .kv dd{color:var(--ink);font-weight:700;text-align:right;min-width:0;overflow-wrap:break-word;word-break:normal}
  .kv dd.blank{color:var(--faint);font-weight:400}
  .docs{display:grid;gap:8px}
  .docs a{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--ink);text-decoration:none;font-weight:700}
  .docs a:hover{border-color:var(--blue)} .docs a span{color:var(--blue);font-size:12px}
  .foot{text-align:center;color:var(--faint);font-size:11.5px;margin-top:6px}
  .err{background:var(--bad-soft);border-radius:10px;padding:14px 16px;color:var(--ink)}
  @media print{ body{background:#fff;padding:0} .sheet{box-shadow:none;margin:0 0 12px;padding:0;width:auto} .noprint{display:none !important} }
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
</head>
<body>
<main id="app">
  <div class="sheet"><p class="sub">Loading the statement of values…</p></div>
</main>
<script>
(function(){
  var API = "https://rwjmxmoopkrcgtyzithb.supabase.co/functions/v1/renewflo-link";
  var K = (location.search.match(/[?&]k=([0-9a-fA-F]{24,64})/) || [])[1] || "";
  var app = document.getElementById("app");
  var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
  var dt = function(iso){ if (!iso) return ""; var d = new Date(iso.length === 10 ? iso + "T12:00:00" : iso); return d.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }); };
  var fail = function(m){ app.innerHTML = '<div class="sheet"><div class="err"><b>' + esc(m) + '</b> Ask RenewFlo for a new link at info@renewflo.co.</div></div>'; };

  var SCHED = [
    ["Building","current_expiring_carrier","policy_number","premium_property_liability","ded_all_perils","100_replacement_cost_building","Property"],
    ["Business Income / Maintenance Fees","sched_bi_carrier","sched_bi_policy","sched_bi_premium","sched_bi_deductible","business_income_rents_value","Property"],
    ["Business Personal Property","sched_bpp_carrier","sched_bpp_policy","sched_bpp_premium","sched_bpp_deductible","contents_bpp_value","Property"],
    ["Water Damage","sched_water_carrier","sched_water_policy","sched_water_premium","ded_water_damage","sched_water_limit","Property"],
    ["Wind / Hail","sched_wind_carrier","sched_wind_policy","sched_wind_premium","ded_wind_hail","limit_wind_hail","Property"],
    ["Ordinance or Law","sched_ol_carrier","sched_ol_policy","sched_ol_premium","sched_ol_deductible","limit_ordinance_or_law","Property"],
    ["Equipment Breakdown","sched_eb_carrier","sched_eb_policy","sched_eb_premium","sched_eb_deductible","limit_boiler_machinery","Property"],
    ["Sewer & Drain Backup","sched_sewer_carrier","sched_sewer_policy","sched_sewer_premium","sched_sewer_deductible","limit_backup_sewer_drains","Property"],
    ["Earthquake","sched_eq_carrier","sched_eq_policy","sched_eq_premium","ded_earthquake","limit_earthquake","Property"],
    ["Flood (Standalone)","sched_flood_carrier","sched_flood_policy","premium_flood","ded_flood","limit_flood","Property"],
    ["Terrorism (TRIA)","sched_terror_carrier","sched_terror_policy","sched_terror_premium","sched_terror_deductible","sched_terror_limit","Property"],
    ["General Liability","sched_gl_carrier","sched_gl_policy","sched_gl_premium","sched_gl_deductible","limit_general_liability","Liability"],
    ["Hired & Non-Owned Auto","sched_hnoa_carrier","sched_hnoa_policy","sched_hnoa_premium","sched_hnoa_deductible","limit_auto","Liability"],
    ["Umbrella / Excess","sched_umb_carrier","sched_umb_policy","premium_umbrella_excess","ded_umbrella","limit_umbrella_excess","Liability"],
    ["Directors & Officers","sched_dno_carrier","sched_dno_policy","premium_do","ded_do","limit_do","Liability"],
    ["Employment Practices","sched_epl_carrier","sched_epl_policy","sched_epl_premium","sched_epl_deductible","sched_epl_limit","Liability"],
    ["Crime / Employee Dishonesty","sched_crime_carrier","sched_crime_policy","premium_crime","sched_crime_deductible","limit_crime","Other coverage"],
    ["Cyber Liability","sched_cyber_carrier","sched_cyber_policy","sched_cyber_premium","sched_cyber_deductible","limit_cyber","Other coverage"],
    ["Workers Compensation","sched_wc_carrier","sched_wc_policy","premium_workers_comp","sched_wc_deductible","limit_workers_comp","Other coverage"]
  ];
  var IN_SCHED = { total_insurable_value_tiv: 1, current_expiring_premium: 1, general_aggregate_limit: 1 };
  SCHED.forEach(function(r){ r.slice(1, 6).forEach(function(k){ IN_SCHED[k] = 1; }); });

  function render(j){
    var a = j.association, V = j.values || {}, carried = j.carried || {};
    var v = function(k){ return (V[k] || "").trim(); };
    var nc = function(x){ return /^not carried$/i.test(x || ""); };
    var applies = function(f){
      return (f.show_when || []).every(function(w){
        if (w.cov) return !!carried[w.cov];
        var x = v(w.key); if (!x) return false;
        if (w.is != null) return x === w.is;
        if (w.gt != null) return Number(String(x).replace(/[^0-9.\-]/g, "")) > w.gt;
        return true;
      });
    };
    document.title = "Statement of Values · " + a.name;
    var group = null;
    var sched = SCHED.map(function(r){
      var band = "";
      if (r[6] !== group){ group = r[6]; band = '<tr class="band"><td colspan="6"><b>' + esc(group) + '</b></td></tr>'; }
      var car = v(r[1]);
      var c = function(k){ var x = v(k); return x ? '<td>' + esc(x) + '</td>' : '<td class="blank">—</td>'; };
      var lim = r[5] === "limit_general_liability" && v("general_aggregate_limit") ? '<td>' + esc(v(r[5]) || "—") + '<br><span class="sub">Aggregate ' + esc(v("general_aggregate_limit")) + '</span></td>' : c(r[5]);
      return band + '<tr><td>' + esc(r[0]) + '</td>' + (nc(car) ? '<td colspan="5" class="nc">Not Carried</td>' : c(r[1]) + c(r[2]) + c(r[3]) + c(r[4]) + lim) + '</tr>';
    }).join("");

    var secs = []; (j.fields || []).forEach(function(f){ if (secs.indexOf(f.section) < 0) secs.push(f.section); });
    var sectionHtml = {};
    secs.forEach(function(sec){
      var fs = j.fields.filter(function(f){ return f.section === sec && !IN_SCHED[f.key] && !/^sched_/.test(f.key) && applies(f); });
      if (!fs.length) return;
      sectionHtml[sec] = '<h2>' + esc(sec) + '</h2><dl class="kv">' + fs.map(function(f){
        var x = v(f.key);
        return '<div><dt>' + esc(f.label) + '</dt><dd' + (x ? "" : ' class="blank"') + '>' + (x ? esc(x) : "—") + '</dd></div>';
      }).join("") + '</dl>';
    });
    var overview = sectionHtml["Account Overview"] || "";
    var detail = secs.filter(function(sec){ return sec !== "Account Overview" && sectionHtml[sec]; }).map(function(sec){ return '<div class="sheet">' + sectionHtml[sec] + '</div>'; }).join("");

    var claims = (j.claims || []);
    var loss = '<div class="sheet"><h2>Loss history</h2>' + (claims.length
      ? '<div class="tbl"><table><thead><tr><th>Date of loss</th><th style="text-align:left">What happened</th><th>Amount</th><th>Status</th></tr></thead><tbody>' + claims.map(function(c){
          return '<tr><td>' + esc(dt(c.date_of_loss)) + '</td><td style="text-align:left;font-weight:400;white-space:normal">' + esc(c.description) + (c.resolution ? '<br><span class="sub">' + esc(c.resolution) + '</span>' : "") + '</td><td>' + (c.amount != null ? "$" + Number(c.amount).toLocaleString("en-US") : "—") + '</td><td>' + esc(c.status === "closed" ? "Closed" : c.status === "denied" ? "Denied" : "Open") + '</td></tr>';
        }).join("") + '</tbody></table></div>'
      : '<p class="sub">No claims on file.</p>') + '</div>';

    var docs = (j.documents || []);
    var docHtml = '<div class="sheet"><h2>Documents</h2>' + (docs.length
      ? '<p class="sub">Download links stay valid for 30 minutes after this page opens. Reload the page for fresh links.</p><div class="docs">' + docs.map(function(d){ return d.url ? '<a href="' + esc(d.url) + '" target="_blank" rel="noopener">' + esc(d.name) + '<span>Download</span></a>' : ""; }).join("") + '</div>'
      : '<p class="sub">No documents have been shared on this link yet.</p>') + '</div>';

    app.innerHTML =
      '<div class="sheet">' + (a.is_demo ? '<div class="demo"><b>Demo.</b> Fake association and fake data, for testing the RenewFlo workflow. Nothing here is real.</div>' : "") +
      '<div class="titlerow"><div><p class="over">Statement of Values</p><h1>' + esc(a.name) + '</h1>' +
      '<p class="sub">' + esc(a.address) + ' · ' + esc(a.units) + ' Residential Units · Renews ' + esc(dt(a.renewal_date)) + '</p></div>' +
      '<div class="btns noprint"><button class="btn primary" type="button" id="xlsxBtn">Download SOV (Excel)</button><button class="btn" type="button" id="printBtn">Print or save as PDF</button></div></div>' +
      '<div class="share">Shared with ' + esc(j.recipient || "you") + ' by RenewFlo. Read-only' + (j.expires_at ? '; this link expires ' + esc(dt(j.expires_at)) : "") + '.</div>' +
      overview + '</div><div class="sheet">' +
      '<div class="top"><div class="card"><span>Total Insurable Value</span><b>' + esc(v("total_insurable_value_tiv") || "—") + '</b></div><div class="card"><span>Current annual premium</span><b>' + esc(v("current_expiring_premium") || "—") + '</b></div></div>' +
      '<h2>Current coverage</h2><div class="tbl"><table><thead><tr><th>Coverage</th><th>Carrier</th><th>Policy #</th><th>Premium</th><th>Deductible</th><th>Amount of coverage</th></tr></thead><tbody>' + sched + '</tbody></table></div></div>' +
      loss + detail + docHtml +
      '<p class="foot">Prepared by RenewFlo LLC · info@renewflo.co · renewflo.co</p>';
    var pb = document.getElementById("printBtn"); if (pb) pb.addEventListener("click", function(){ window.print(); });
    var xb = document.getElementById("xlsxBtn");
    if (xb) xb.addEventListener("click", function(){
      if (!window.XLSX){ xb.textContent = "Excel download unavailable — reload the page"; return; }
      try { downloadXlsx(j, v, applies, secs, claims); } catch (e) { console.error(e); xb.textContent = "Couldn't build the file — reload and try again"; }
    });
  }

  /* ---------- Excel SOV: one tab per section, RenewFlo formatting ---------- */
  function downloadXlsx(j, v, applies, secs, claims){
    var a = j.association, year = String(new Date().getFullYear());
    var C = { band: "1E5BF5", sec: "2563EB", sub: "3B82F6", ink: "15171E", stripe: "F4F8FC", line: "D9E2F0", red: "C7362A", redSoft: "FBE7E5", muted: "6B7486" };
    var font = function(o){ var f = { name: "Calibri", sz: 11, color: { rgb: C.ink } }; for (var k in o) f[k] = o[k]; return f; };
    var border = { bottom: { style: "thin", color: { rgb: C.line } } };
    var ST = {
      title: { font: font({ sz: 16, bold: true, color: { rgb: "FFFFFF" } }), fill: { fgColor: { rgb: C.band } }, alignment: { vertical: "center" } },
      subtitle: { font: font({ color: { rgb: "FFFFFF" } }), fill: { fgColor: { rgb: C.band } } },
      head: { font: font({ bold: true, color: { rgb: "FFFFFF" } }), fill: { fgColor: { rgb: C.sec } }, alignment: { horizontal: "center", vertical: "center", wrapText: true } },
      headL: { font: font({ bold: true, color: { rgb: "FFFFFF" } }), fill: { fgColor: { rgb: C.sec } }, alignment: { vertical: "center" } },
      sub: { font: font({ bold: true, color: { rgb: "FFFFFF" } }), fill: { fgColor: { rgb: C.sub } } },
      label: function(i){ return { font: font({}), fill: { fgColor: { rgb: i % 2 ? C.stripe : "FFFFFF" } }, alignment: { vertical: "center", wrapText: true }, border: border }; },
      val: function(i){ return { font: font({}), fill: { fgColor: { rgb: i % 2 ? C.stripe : "FFFFFF" } }, alignment: { horizontal: "center", vertical: "center", wrapText: true }, border: border }; },
      nc: { font: font({ bold: true, color: { rgb: C.red } }), fill: { fgColor: { rgb: C.redSoft } }, alignment: { horizontal: "center", vertical: "center" }, border: border },
      note: { font: font({ italic: true, sz: 9, color: { rgb: C.muted } }) }
    };
    var wb = XLSX.utils.book_new();
    function sheet(name, width){
      var rows = [], merges = [], heights = [];
      var add = function(cells, style, h){ rows.push(cells.map(function(c, i){ return { v: c == null ? "" : String(c), t: "s", s: typeof style === "function" ? style(i) : (Array.isArray(style) ? style[i] : style) }; })); if (h) heights[rows.length - 1] = { hpt: h }; return rows.length - 1; };
      var r0 = add([a.name + " — Statement of Values"].concat(new Array(width - 1).fill("")), ST.title, 26); merges.push({ s: { r: r0, c: 0 }, e: { r: r0, c: width - 1 } });
      var r1 = add([a.address + " · " + a.units + " units · Renews " + dt(a.renewal_date)].concat(new Array(width - 1).fill("")), ST.subtitle); merges.push({ s: { r: r1, c: 0 }, e: { r: r1, c: width - 1 } });
      add(new Array(width).fill(""), {});
      return { name: name, rows: rows, merges: merges, heights: heights, add: add, width: width };
    }
    function finish(sh, cols){
      var ws = XLSX.utils.aoa_to_sheet(sh.rows.map(function(r){ return r.map(function(c){ return c.v; }); }));
      sh.rows.forEach(function(r, ri){ r.forEach(function(c, ci){ var ref = XLSX.utils.encode_cell({ r: ri, c: ci }); if (ws[ref]) ws[ref].s = c.s; }); });
      ws["!merges"] = sh.merges; ws["!cols"] = cols.map(function(w){ return { wch: w }; }); ws["!rows"] = sh.heights;
      XLSX.utils.book_append_sheet(wb, ws, sh.name.replace(/[\\\/\?\*\[\]:]/g, "").slice(0, 31));
    }
    function fieldRows(sh, fs){
      sh.add(["Field", year], [ST.headL, ST.head]);
      fs.forEach(function(f, i){ sh.add([f.label, v(f.key)], function(c){ return c === 0 ? ST.label(i) : ST.val(i); }); });
    }
    secs.forEach(function(sec){
      var fs = j.fields.filter(function(f){ return f.section === sec && !IN_SCHED[f.key] && !/^sched_/.test(f.key) && applies(f); });
      if (/^Insurance Coverage/.test(sec)){
        var sh = sheet(sec, 6);
        sh.add(["Total Insurable Value (TIV)", v("total_insurable_value_tiv"), "", "", "", ""], function(c){ return c < 2 ? (c ? ST.val(0) : ST.label(0)) : {}; });
        sh.add(["Premium total", v("current_expiring_premium"), "", "", "", ""], function(c){ return c < 2 ? (c ? ST.val(1) : ST.label(1)) : {}; });
        sh.add(["", "", "", "", "", ""], {});
        sh.add(["Coverage", "Carrier", "Policy #", "Premium", "Deductible", "Amount of coverage"], function(c){ return c ? ST.head : ST.headL; });
        var group = null, i = 0;
        SCHED.forEach(function(r){
          if (r[6] !== group){ group = r[6]; var gr = sh.add([group, "", "", "", "", ""], ST.sub); sh.merges.push({ s: { r: gr, c: 0 }, e: { r: gr, c: 5 } }); i = 0; }
          var car = v(r[1]);
          if (/^not carried$/i.test(car)){ var nr = sh.add([r[0], "Not Carried", "", "", "", ""], function(c){ return c ? ST.nc : ST.label(i); }); sh.merges.push({ s: { r: nr, c: 1 }, e: { r: nr, c: 5 } }); }
          else {
            var lim = v(r[5]); if (r[5] === "limit_general_liability" && v("general_aggregate_limit")) lim = (lim ? lim + " · " : "") + "Aggregate " + v("general_aggregate_limit");
            sh.add([r[0], car, v(r[2]), v(r[3]), v(r[4]), lim], function(c){ return c ? ST.val(i) : ST.label(i); });
          }
          i++;
        });
        if (fs.length){ sh.add(["", "", "", "", "", ""], {}); sh.add(["Field", year, "", "", "", ""], function(c){ return c === 0 ? ST.headL : c === 1 ? ST.head : {}; });
          fs.forEach(function(f, k){ sh.add([f.label, v(f.key), "", "", "", ""], function(c){ return c === 0 ? ST.label(k) : c === 1 ? ST.val(k) : {}; }); }); }
        sh.add(["", "", "", "", "", ""], {});
        var lh = sh.add(["Loss history", "", "", "", "", ""], ST.sub); sh.merges.push({ s: { r: lh, c: 0 }, e: { r: lh, c: 5 } });
        sh.add(["Date of loss", "What happened", "", "Amount", "Status", "Resolution"], function(c){ return c ? ST.head : ST.headL; });
        if (!claims.length) sh.add(["No claims on file", "", "", "", "", ""], ST.note);
        claims.forEach(function(c, k){
          var rr = sh.add([dt(c.date_of_loss), c.description, "", c.amount != null ? "$" + Number(c.amount).toLocaleString("en-US") : "", c.status === "closed" ? "Closed" : c.status === "denied" ? "Denied" : "Open", c.resolution || ""], function(x){ return x ? ST.val(k) : ST.label(k); });
          sh.merges.push({ s: { r: rr, c: 1 }, e: { r: rr, c: 2 } });
        });
        finish(sh, [34, 28, 22, 14, 16, 30]);
      } else {
        if (!fs.length) return;
        var s2 = sheet(sec, 2); fieldRows(s2, fs); finish(s2, [62, 36]);
      }
    });
    var fname = a.name.replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "") + "_SOV_" + year + ".xlsx";
    XLSX.writeFile(wb, fname);
  }

  if (!K){ fail("This link is missing its access code."); return; }
  fetch(API + "?k=" + K, { cache: "no-store" })
    .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
    .then(function(res){ if (!res.ok || !res.j || res.j.role !== "broker"){ fail((res.j && res.j.error) || "This link isn't valid or has expired."); return; } render(res.j); })
    .catch(function(){ fail("We couldn't load the statement of values. Check your connection and reload the page."); });
})();
</script>
</body>
</html>
