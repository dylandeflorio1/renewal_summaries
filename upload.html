<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Upload documents · RenewFlo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap">
<style>
  /* RenewFlo's own upload desk: drop files, name and file each one, upload. */
  :root{ --ink:#141B2D; --body:#3F4859; --muted:#7C8698; --faint:#8E97A8; --line:#DCE3EE; --soft:#F1F4F9; --blue:#2D6BD4; --blue-soft:#E8F1FE; --bg:#EDF0F5; --good:#0F7A54; --good-soft:#E3F5EC; --bad:#C7362A; --bad-soft:#FBE7E5; }
  *{box-sizing:border-box;margin:0}
  [hidden]{display:none !important}
  body{font-family:'Lato',Arial,sans-serif;color:var(--body);font-size:14px;line-height:1.5;background:var(--bg);padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .sheet{background:#fff;max-width:960px;margin:0 auto;border-radius:6px;box-shadow:0 2px 14px rgba(15,27,45,.08);padding:32px 36px;display:flex;flex-direction:column;gap:18px}
  @media (max-width:700px){.sheet{padding:20px 16px}}
  h1{font-family:Arial,'Liberation Sans',sans-serif;font-size:22px;color:var(--ink);font-weight:600}
  .over{color:var(--blue);text-transform:uppercase;font-size:10.5px;font-weight:700;letter-spacing:1.6px}
  .sub{color:var(--muted);font-size:13px}
  .drop{border:2px dashed #B9C6DA;border-radius:12px;padding:28px;text-align:center;background:var(--soft);cursor:pointer;transition:border-color .15s,background .15s}
  .drop:hover,.drop.over{border-color:var(--blue);background:var(--blue-soft)}
  .drop b{color:var(--ink);font-size:15px}
  .row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.3fr) auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  @media (max-width:820px){.row{grid-template-columns:1fr 1fr}}
  .head{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--faint);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:6px}
  input,select{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
  input:focus,select:focus{outline:2px solid var(--blue);outline-offset:0;border-color:var(--blue)}
  .fname{font-size:11.5px;color:var(--faint);overflow-wrap:anywhere}
  .st{font-size:12px;font-weight:700;white-space:nowrap}
  .st.ok{color:var(--good)} .st.bad{color:var(--bad)} .st.wait{color:var(--muted)}
  .x{background:none;border:0;color:var(--faint);font-size:18px;cursor:pointer;padding:0 4px}
  .btns{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{font:inherit;font-weight:700;border-radius:100px;padding:9px 18px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .note{border-radius:10px;padding:12px 14px;background:var(--blue-soft);color:var(--ink)}
  .note.err{background:var(--bad-soft)} .note.ok{background:var(--good-soft)}
  label.chk{display:flex;gap:6px;align-items:center;font-size:12.5px;white-space:nowrap}
  label.chk input{width:auto}
</style>
</head>
<body>
<main class="sheet">
  <div><p class="over">RenewFlo · Documents</p><h1 id="title">Upload documents</h1><p class="sub" id="sub">Loading…</p></div>
  <div class="note err" id="err" hidden></div>
  <div id="app" hidden>
    <div class="drop" id="drop" role="button" tabindex="0"><b>Drop files here, or click to choose</b><p class="sub">PDF, Word, Excel or images · up to 50 MB each · as many as you like</p></div>
    <input type="file" id="picker" multiple hidden accept=".pdf,.doc,.docx,.xls,.xlsx,.csv,.jpg,.jpeg,.png,.heic,.txt">
    <div id="list" hidden>
      <div class="row head"><span>Document name</span><span>Category</span><span>Subfolder</span><span>File it as</span><span></span></div>
      <div id="rows"></div>
    </div>
    <div class="btns" style="margin-top:14px"><button class="btn primary" id="go" type="button" disabled>Upload</button><span class="sub" id="summary"></span></div>
    <div class="note ok" id="done" hidden></div>
  </div>
</main>
<script>
(function(){
  var API = "https://rwjmxmoopkrcgtyzithb.supabase.co/functions/v1/renewflo-link";
  var K = (location.search.match(/[?&]k=([0-9a-f]{24,64})/) || [])[1] || "";
  var PRE = Number((location.search.match(/[?&]doc=(\d+)/) || [])[1] || 0);
  var $ = function(s){ return document.querySelector(s); };
  var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
  var data = null, items = [], n = 0;
  function fail(m){ $("#err").hidden = false; $("#err").innerHTML = "<b>" + esc(m) + "</b> Go back to your SOV review, reload it, and click Upload again for a fresh link."; $("#sub").textContent = ""; }
  var post = function(b){ b.k = K; return fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) }).then(function(r){ return r.json().then(function(j){ if (!r.ok) throw new Error(j.error || "Something went wrong."); return j; }); }); };

  function subfolders(cat){ var o = []; data.documents.forEach(function(d){ if (d.category === cat && d.subfolder && o.indexOf(d.subfolder) < 0) o.push(d.subfolder); }); return o.sort(); }
  function guessCat(name){
    var n = name.toLowerCase().replace(/[_\-.]+/g, " ");
    if (/deed|trust|bylaw|by-law|rules|declaration|amendment|condo doc/.test(n)) return "Condo Documents";
    if (/budget|financ|balance|income|reserve|audit|bank|statement of (cash|activit)/.test(n)) return "Financials";
    if (/polic|dec(laration)?s?\b|dec page|quote|binder|coi|certificate|loss run|sov|statement of values|endorse|umbrella|d&o|crime|workers/.test(n)) return "Insurance Documents";
    if (/inspect|nfpa|sprinkler|fire alarm|elevator|engineer|report|survey|appraisal|cna|capital needs/.test(n)) return "Inspections";
    return "Other";
  }
  function nice(fname){ return fname.replace(/\.[^.]+$/, "").replace(/[_]+/g, " ").replace(/\s+/g, " ").trim(); }

  function addFiles(files){
    [].forEach.call(files, function(f){
      var pre = PRE && !items.length ? data.documents.filter(function(d){ return d.id === PRE; })[0] : null;
      items.push({ id: ++n, file: f, name: pre ? pre.name : nice(f.name), category: pre ? pre.category : guessCat(f.name), subfolder: pre ? (pre.subfolder || "") : "", target: pre ? String(pre.id) : "new", share: false, state: "ready", msg: "" });
    });
    render();
  }
  function render(){
    var cats = data.categories;
    $("#list").hidden = !items.length;
    $("#rows").innerHTML = items.map(function(it){
      var needed = data.documents.filter(function(d){ return !d.has_file; });
      var lists = cats.map(function(c){ return '<datalist id="sf-' + it.id + '-' + c.replace(/\W/g, "") + '">' + subfolders(c).map(function(s){ return '<option value="' + esc(s) + '"></option>'; }).join("") + '</datalist>'; }).join("");
      var dis = it.state !== "ready" ? " disabled" : "";
      var attach = it.target !== "new";
      return '<div class="row" data-id="' + it.id + '">' + lists +
        '<div><input data-f="name" value="' + esc(it.name) + '" aria-label="Document name"' + dis + (attach ? " readonly" : "") + '><div class="fname">' + esc(it.file.name) + ' · ' + Math.max(1, Math.round(it.file.size / 1024)) + ' KB</div></div>' +
        '<select data-f="category" aria-label="Category"' + dis + (attach ? " disabled" : "") + '>' + cats.map(function(c){ return '<option' + (c === it.category ? " selected" : "") + '>' + esc(c) + '</option>'; }).join("") + '</select>' +
        '<input data-f="subfolder" list="sf-' + it.id + '-' + it.category.replace(/\W/g, "") + '" value="' + esc(it.subfolder) + '" placeholder="None" aria-label="Subfolder"' + dis + (attach ? " readonly" : "") + '>' +
        '<div><select data-f="target" aria-label="File it as"' + dis + '><option value="new"' + (attach ? "" : " selected") + '>A new document</option>' +
          (needed.length ? '<optgroup label="The file for a document we asked for">' + needed.map(function(d){ return '<option value="' + d.id + '"' + (String(d.id) === it.target ? " selected" : "") + '>' + esc(d.name) + '</option>'; }).join("") + '</optgroup>' : "") +
        '</select>' + (attach ? "" : '<label class="chk" style="margin-top:4px"><input type="checkbox" data-f="share"' + (it.share ? " checked" : "") + dis + '> Share with brokers</label>') + '</div>' +
        '<div>' + (it.state === "ready" ? '<button class="x" type="button" data-rm="' + it.id + '" aria-label="Remove">×</button>' : '<span class="st ' + (it.state === "done" ? "ok" : it.state === "error" ? "bad" : "wait") + '">' + esc(it.msg) + '</span>') + '</div></div>';
    }).join("");
    var ready = items.filter(function(i){ return i.state === "ready"; }).length;
    $("#go").disabled = !ready;
    $("#go").textContent = ready > 1 ? "Upload " + ready + " files" : "Upload";
  }
  function find(el){ var r = el.closest(".row"); return r && items.filter(function(i){ return String(i.id) === r.dataset.id; })[0]; }
  document.addEventListener("input", function(e){ var it = find(e.target); if (!it || !e.target.dataset.f) return; var f = e.target.dataset.f; if (f === "share") it.share = e.target.checked; else it[f] = e.target.value; });
  document.addEventListener("change", function(e){
    var it = find(e.target); if (!it) return;
    if (e.target.dataset.f === "category"){ it.category = e.target.value; render(); }
    if (e.target.dataset.f === "target"){
      it.target = e.target.value;
      var d = data.documents.filter(function(x){ return String(x.id) === it.target; })[0];
      if (d){ it.name = d.name; it.category = d.category; it.subfolder = d.subfolder || ""; } else { it.name = nice(it.file.name); it.category = guessCat(it.file.name); it.subfolder = ""; }
      render();
    }
    if (e.target.dataset.f === "share") it.share = e.target.checked;
  });
  document.addEventListener("click", function(e){ var rm = e.target.closest("[data-rm]"); if (rm){ items = items.filter(function(i){ return String(i.id) !== rm.dataset.rm; }); render(); } });

  function uploadOne(it){
    if (it.file.size > 50 * 1024 * 1024){ it.state = "error"; it.msg = "Over 50 MB"; return Promise.resolve(); }
    if (!it.name.trim()){ it.state = "error"; it.msg = "Needs a name"; return Promise.resolve(); }
    it.state = "busy"; it.msg = "Uploading…"; render();
    var body = { action: "upload_url", filename: it.file.name };
    if (it.target === "new") body.new_doc = { name: it.name.trim(), category: it.category, subfolder: it.subfolder.trim(), share_with_broker: it.share };
    else body.doc_id = Number(it.target);
    var docId = null;
    return post(body)
      .then(function(u){
        docId = u.doc_id;
        return fetch(u.url, { method: "PUT", headers: { "Content-Type": it.file.type || "application/octet-stream", "x-upsert": "false" }, body: it.file })
          .then(function(r){ if (!r.ok) throw new Error("The file didn't upload."); return post({ action: "uploaded", doc_id: docId, path: u.path }); });
      })
      .then(function(){
        it.state = "done"; it.msg = "Uploaded ✓";
        if (it.target !== "new") data.documents.forEach(function(d){ if (String(d.id) === it.target) d.has_file = true; });
        else data.documents.push({ id: docId, name: it.name.trim(), category: it.category, subfolder: it.subfolder.trim() || null, has_file: true });
      })
      .catch(function(err){
        it.state = "error"; it.msg = err.message || "Failed";
        if (it.target === "new" && docId) post({ action: "discard_new", doc_id: docId }).catch(function(){});
      });
  }
  $("#go").addEventListener("click", function(){
    var queue = items.filter(function(i){ return i.state === "ready"; });
    $("#go").disabled = true; $("#done").hidden = true;
    queue.reduce(function(p, it){ return p.then(function(){ return uploadOne(it); }).then(render); }, Promise.resolve()).then(function(){
      var ok = queue.filter(function(i){ return i.state === "done"; }).length, bad = queue.length - ok;
      $("#done").hidden = false; $("#done").className = "note " + (bad ? "err" : "ok");
      $("#done").innerHTML = ok + (ok === 1 ? " file uploaded." : " files uploaded.") + (bad ? " " + bad + " didn't go through; see the red notes above." : "") + " Reload your SOV review to see them in the Documents tab.";
    });
  });
  var drop = $("#drop"), picker = $("#picker");
  drop.addEventListener("click", function(){ picker.click(); });
  drop.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " "){ e.preventDefault(); picker.click(); } });
  picker.addEventListener("change", function(){ addFiles(picker.files); picker.value = ""; });
  ["dragenter", "dragover"].forEach(function(t){ drop.addEventListener(t, function(e){ e.preventDefault(); drop.classList.add("over"); }); });
  ["dragleave", "drop"].forEach(function(t){ drop.addEventListener(t, function(e){ e.preventDefault(); drop.classList.remove("over"); }); });
  drop.addEventListener("drop", function(e){ if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files); });

  if (!K){ fail("This upload link is missing its access code."); return; }
  fetch(API + "?k=" + K, { cache: "no-store" }).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
    .then(function(res){
      if (!res.ok || res.j.role !== "uploader"){ fail((res.j && res.j.error) || "This upload link has expired."); return; }
      data = res.j; document.title = "Upload documents · " + data.association.name;
      $("#title").textContent = "Upload documents for " + data.association.name;
      var pre = PRE ? data.documents.filter(function(d){ return d.id === PRE; })[0] : null;
      $("#sub").textContent = pre ? "Choose the file for “" + pre.name + "”, then click Upload." : "Add files, give each a name and a category, then upload. Files go to the association's private storage.";
      $("#app").hidden = false;
    })
    .catch(function(){ fail("Couldn't reach RenewFlo."); });
})();
</script>
</body>
</html>
